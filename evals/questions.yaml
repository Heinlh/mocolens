# --- hybrid: needs a number from the data and context from a report ---

- id: h01-pedestrian-trend-and-response
  category: hybrid
  question: How many pedestrian crashes were there in 2022 and in 2025, and what is the county doing about pedestrian safety?
  sql: >
    SELECT SUM((EXTRACT(year FROM crash_date) = 2022)::INT), SUM((EXTRACT(year FROM crash_date) = 2025)::INT)
    FROM fact_crashes WHERE pedestrian_involved
  tools: [query_analytics, search_reports]
  cite: any

- id: h02-cyclists-and-bikeways
  category: hybrid
  question: How many crashes involved cyclists in 2025, and what bike infrastructure is the county building?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE cyclist_involved AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics, search_reports]
  cite: any

- id: h03-fatal-and-vision-zero
  category: hybrid
  question: How many fatal crashes were there in 2025, and what does the county's Vision Zero program aim to do about them?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE severity = 'fatal' AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics, search_reports]
  cite: any

- id: h04-top-road-and-priority
