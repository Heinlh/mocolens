  cite: any

# --- ambiguous: no single right answer. Graded on behaviour: it must look at
# the data rather than guess, and say what it assumed or cannot measure. ---

- id: a01-getting-worse
  category: ambiguous
  question: Is it getting worse?
  tools: [query_analytics]
  caveat: true

- id: a02-where-to-avoid
  category: ambiguous
  question: Where should I avoid driving?
  tools: [query_analytics]
  caveat: true

- id: a03-safest-area
  category: ambiguous
  question: What is the safest area in the county?
  tools: [query_analytics]
  caveat: true
  # A crash count is not a risk: the answer has to say so, in some form.
  expect: [[traffic volume, per mile, exposure, how much traffic, how many people, not measure, cannot measure, not a measure, rate]]

- id: a04-how-bad-georgia
  category: ambiguous
  question: How bad is Georgia Ave?
  tools: [query_analytics]
  expect: [Georgia]

- id: a05-what-changed
  category: ambiguous
  question: What changed last year?
  tools: [query_analytics]
  caveat: true

- id: a06-bikes
  category: ambiguous
  question: Tell me about bikes.
  tools: [[query_analytics, search_reports]]

- id: a07-since-vision-zero
  category: ambiguous
  question: Are things better since Vision Zero started?
  tools: [query_analytics]
  caveat: true  # before/after is not cause and effect

