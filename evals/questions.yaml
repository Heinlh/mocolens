# The agent evaluation set. Run it with: python scripts/evaluate.py
#
# Each case:
#   id, category, question
#   sql        reference query, run against the curated tables at evaluation
#              time; every value in its first row must appear in the answer.
#              Used instead of a written-down number so a data refresh does
#              not break the case.
#   sql_any    several reference queries for a question with more than one
#              defensible reading; the answer must state the first value of
#              any one of them.
#   expect     facts the answer must state. A number is matched numerically,
#              a string as a case-insensitive substring, and a nested list is
#              alternatives (any one will do).
#   tools      tools that must be called (a nested list is alternatives).
#   no_tools   tools that must not be called, or `all`.
#   cite       `none` (no report may be cited), `any` (at least one report),
#              or the title fragments of the documents that hold the answer.
#   caveat     true: the answer must carry at least one caveat.
#   limitation true: the answer must say the data cannot support the question.
#   decline    true: out of scope - must be stopped by the API's scope gate, or
#              declined by the agent without calling a tool.
#
# Document facts below were read from the indexed reports themselves
# (search_reports), not recalled. If a report is revised, re-check them.

# --- structured: one right number, from crash data alone ---

- id: s01-pedestrian-2025
  category: structured
  question: How many crashes involved pedestrians in 2025?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE pedestrian_involved AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics]
  cite: none

- id: s02-fatal-2024
  category: structured
  question: How many fatal crashes were there in 2024?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE severity = 'fatal' AND EXTRACT(year FROM crash_date) = 2024
  tools: [query_analytics]
  cite: none

- id: s03-total-2022
  category: structured
  question: How many total crashes were recorded in Montgomery County in 2022?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE EXTRACT(year FROM crash_date) = 2022
  tools: [query_analytics]
  cite: none

- id: s04-top-road
  category: structured
  question: Which road has had the most crashes since 2015?
  # The distinctive word only: the data says "GEORGIA AVE", an answer may say
  # "Georgia Avenue".
  sql: SELECT split_part(road_name, ' ', 1) FROM fact_crashes WHERE road_name IS NOT NULL GROUP BY road_name ORDER BY COUNT(*) DESC LIMIT 1
  tools: [query_analytics]
  cite: none

- id: s05-fewest-year
  category: structured
  question: Which full year since 2015 had the fewest crashes, and how many were there?
  sql: >
    SELECT y, n FROM (
      SELECT EXTRACT(year FROM crash_date)::INT AS y, COUNT(*) AS n
      FROM fact_crashes WHERE crash_date IS NOT NULL GROUP BY 1
    ) WHERE y < (SELECT MAX(EXTRACT(year FROM crash_date)) FROM fact_crashes)
    ORDER BY n LIMIT 1
  tools: [query_analytics]
  cite: none

- id: s06-hit-and-run-2025
  category: structured
  question: How many hit-and-run crashes happened in 2025?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE hit_run AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics]
  cite: none

- id: s07-pedestrian-share-2025
  category: structured
  question: What percentage of crashes in 2025 involved a pedestrian?
  sql: SELECT ROUND(100.0 * SUM(pedestrian_involved::INT) / COUNT(*), 1) FROM fact_crashes WHERE EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics]
  cite: none

- id: s08-pedestrian-change-2022-2025
  category: structured
  question: How did the number of pedestrian crashes change from 2022 to 2025?
  sql: >
    SELECT SUM((EXTRACT(year FROM crash_date) = 2022)::INT), SUM((EXTRACT(year FROM crash_date) = 2025)::INT)
    FROM fact_crashes WHERE pedestrian_involved
  # Arithmetic belongs to a statistics tool, never to the model's prose.
  tools: [query_analytics, [percent_change, year_over_year]]
  cite: none

- id: s09-top-agency-2025
  category: structured
  question: Which police agency reported the most crashes in 2025?
  sql: SELECT agency_name FROM fact_crashes WHERE EXTRACT(year FROM crash_date) = 2025 GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
  tools: [query_analytics]
  cite: none

- id: s10-common-collision
  category: structured
  question: What is the most common type of collision in the crash data?
  expect: [[rear end, rear-end]]
  tools: [query_analytics]
  cite: none

- id: s11-fatal-pedestrian-2025
  category: structured
  question: How many fatal crashes in 2025 involved a pedestrian?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE pedestrian_involved AND severity = 'fatal' AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics]
  cite: none

- id: s12-busiest-weekday
  category: structured
  question: On which day of the week do the most crashes happen?
  sql: SELECT dayname(crash_date) FROM fact_crashes WHERE crash_date IS NOT NULL GROUP BY 1 ORDER BY COUNT(*) DESC LIMIT 1
  tools: [query_analytics]
  cite: none

- id: s13-georgia-ave-2025
  category: structured
  question: How many crashes were recorded on Georgia Ave in 2025?
  # 'GEORGIA AVE', not 'GEORGIA': the bare word also matches GEORGIAN WAY.
  sql: SELECT COUNT(*) FROM fact_crashes WHERE road_name ILIKE '%GEORGIA AVE%' AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics]
  cite: none

- id: s14-rain-2024
  category: structured
  question: How many crashes happened in the rain in 2024?
  # A deliberate trap: the police feed recoded this field in 2024 ("RAINING"
  # became "RAIN"), so a query that matches only one spelling returns zero or
  # misses every later year.
  # Counting freezing rain as rain is as defensible as leaving it out.
  sql_any:
    - SELECT COUNT(*) FROM fact_crashes WHERE weather IN ('RAIN', 'RAINING') AND EXTRACT(year FROM crash_date) = 2024
    - SELECT COUNT(*) FROM fact_crashes WHERE weather ILIKE '%RAIN%' AND EXTRACT(year FROM crash_date) = 2024
  tools: [query_analytics]
  cite: none

- id: s15-partial-year
  category: structured
  question: How many crashes have been recorded so far in 2026?
  sql: SELECT COUNT(*) FROM fact_crashes WHERE EXTRACT(year FROM crash_date) = 2026
  tools: [query_analytics]
  cite: none
  caveat: true  # a partial year, and the answer should say so

- id: s16-community-2025
  category: structured
  question: How many crashes happened in Silver Spring in 2025?
  # Before the community column existed the agent answered this from a
  # latitude/longitude box it made up, and said nothing about how.
  sql: SELECT COUNT(*) FROM fact_crashes WHERE community = 'Silver Spring' AND EXTRACT(year FROM crash_date) = 2025
  tools: [query_analytics]
  cite: none

- id: s17-community-comparison
  category: structured
  question: Did Silver Spring or Bethesda have more pedestrian crashes in 2024?
  sql: >
    SELECT SUM((community = 'Silver Spring')::INT), SUM((community = 'Bethesda')::INT)
    FROM fact_crashes WHERE pedestrian_involved AND EXTRACT(year FROM crash_date) = 2024
  tools: [query_analytics]
  cite: none

