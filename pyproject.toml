[project]
name = "mocolens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "pyyaml>=6.0",
    "docling>=2.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
