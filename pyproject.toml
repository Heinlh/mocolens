[project]
name = "mocolens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    # The report index is a flat numpy array searched by dot product, and
    # the query encoder runs on onnxruntime rather than torch - see
    # src/mocolens/storage/vector_store.py for why neither Chroma nor
    # PyTorch is here.
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Only needed to run the ingestion/processing pipeline (scripts/ingest.py,
# build_curated_tables.py, export_embedding_onnx.py), not to serve the API -
# Docling and torch drag in a multi-GB GPU build, so the API's Dockerfile
# deliberately does NOT install this extra.
ingest = [
    "httpx>=0.27", "beautifulsoup4>=4.12", "docling>=2.0",
    # scripts/export_embedding_onnx.py only
    "torch>=2.0", "transformers>=4.40", "onnx>=1.16", "onnxscript>=0.1",
]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
