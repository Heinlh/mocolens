[project]
name = "mocolens"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "duckdb>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
# Only needed to run the ingestion/processing pipeline (scripts/ingest.py,
# build_curated_tables.py, etc.), not to serve the API - Docling in
# particular drags in a multi-GB GPU torch build, so the API's Dockerfile
# deliberately does NOT install this extra.
ingest = ["httpx>=0.27", "beautifulsoup4>=4.12", "docling>=2.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
